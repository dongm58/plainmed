[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plainmed"
version = "0.1.0"
description = "Plain-language rewriting of Cochrane review abstracts, with a faithfulness checker"
authors = [{ name = "Michael Dong" }]
requires-python = ">=3.11"

[tool.setuptools]
packages = ["plainmed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]
